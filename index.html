<style>

:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#202b3a;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}

<script>
const lines=[{"original": "이 몸 삼기실 제 님을 조차 삼기시니,", "translation": "이 몸 태어날 때 임을 좇아 태어나니,", "note": "*삼기다 : 태어나다"}, {"original": "ᄒᆞᆫᄉᆡᆼ 연분(緣分)이며 하ᄂᆞᆯ 모ᄅᆞᆯ 일이런가.", "translation": "한평생의 연분임을 하늘이 모를 일이던가.", "note": ""}, {"original": "나 ᄒᆞ나 졈어 잇고 님 ᄒᆞ나 날 괴시니,", "translation": "나 하나 젊어 있고 임 하나 날 사랑하시니,", "note": "*괴다 : 사랑하다"}, {"original": "이 ᄆᆞ음 이 ᄉᆞ랑 견졸 ᄃᆡ 노여 업다.", "translation": "이 마음 이 사랑 견줄 데가 전혀 없다.", "note": "*견주다 : 비교하다"}, {"original": "평ᄉᆡᆼ(平生)애 원(願)ᄒᆞ요ᄃᆡ ᄒᆞᆫᄃᆡ 녜자 ᄒᆞ얏더니,", "translation": "평생에 원하기를 함께 살자 하였더니", "note": "*녜다 : 가다, 살아가다"}, {"original": "늙거야 므ᄉᆞ 일로 외오 두고 글이ᄂᆞᆫ고.", "translation": "늙어서 무슨 일로 외로이 두고 그리워하는고.", "note": ""}, {"original": "엇그제 님을 뫼셔 광한뎐(廣寒殿)의 올낫더니,", "translation": "엊그제 임을 모셔 광한전에 올랐더니", "note": "*광한전 : 천상의 궁궐(임금과 함께한 과거의 궁궐)"}, {"original": "그 더ᄃᆡ 엇디ᄒᆞ야 하계(下界)예 ᄂᆞ려오니,", "translation": "그 동안에 어찌하여 인간 세상에 내려오니", "note": "*하계 : 인간 세상(현재 은거해 있는 전남 창평)"}, {"original": "올 적의 비슨 머리 헛틀언디 삼 년(三 年)일쇠", "translation": "올 적에 빗은 머리 헝클어진 지 삼 년이라.", "note": ""}, {"original": "연지분(臙脂粉) 잇ᄂᆡ마ᄂᆞᆫ 눌 위ᄒᆞ야 고이 ᄒᆞᆯ고.", "translation": "연지분이 있지만 누구를 위하여 곱게 할까?", "note": "*연지분 : 화장품(화자가 여성임을 드러냄)"}, {"original": "ᄆᆞ음의 ᄆᆡ친 실음 텹텹(疊疊)이 ᄡᅡ혀 이셔,", "translation": "마음에 맺힌 시름이 겹겹이 쌓여 있어", "note": ""}, {"original": "짓ᄂᆞ니 한숨이오 디ᄂᆞ니 눈믈이라.", "translation": "짓는 것이 한숨이고 떨어지는 것이 눈물이라.", "note": ""}, {"original": "인ᄉᆡᆼ(人生)은 유ᄒᆞᆫ(有限)ᄒᆞᆫᄃᆡ 시ᄅᆞᆷ도 그지 업다.", "translation": "인생은 유한한데 시름은 끝이 없다.", "note": ""}, {"original": "무심(無心)ᄒᆞᆫ 셰월(歲月)은 믈 흐ᄅᆞ듯 ᄒᆞᄂᆞᆫ고야.", "translation": "무심한 세월은 물 흐르는 듯 하는구나.", "note": ""}, {"original": "염냥(炎凉)이 ᄯᅢᄅᆞᆯ 아라 가ᄂᆞᆫ ᄃᆞᆺ 고텨 오니,", "translation": "더위와 추위가 때를 알아 가는 듯 다시 오니", "note": "*염량 : 추위와 더위(여름과 겨울)"}, {"original": "듯거니 보거니 늣길 일도 하도 할샤.", "translation": "듣거니 보거니 느낄 일도 많기도 많구나.", "note": ""}, {"original": "동풍(東風)이 건듯 부러 젹셜(積雪)을 헤텨 내니,", "translation": "봄바람이 문득 불어 쌓인 눈을 헤쳐 내니,", "note": "*동풍 : 봄바람(봄의 계절감)"}, {"original": "창(窓) 밧긔 심근 ᄆᆡ화(梅花) 두세 가지 픠여셰라.", "translation": "창밖에 심은 매화 두세 가지 피었구나.", "note": "*매화 : 화자의 지조와 절개를 드러냄"}, {"original": "ᄀᆞᆺ득 ᄂᆡᆼ담(冷淡)ᄒᆞᆫᄃᆡ 암향(暗香)은 므ᄉᆞ 일고.", "translation": "가뜩이나 냉담한데 그윽한 향은 무슨 일인고.", "note": "*암향 : 그윽한 향기(변하지 않은 충성심을 뜻함)"}, {"original": "황혼(黃昏)의 ᄃᆞᆯ이 조차 벼마ᄐᆡ 빗최니,", "translation": "황혼에 달이 쫓아와 베갯머리에 비치니,", "note": "*달 : 임금을 상징"}, {"original": "늣기ᄂᆞᆫ ᄃᆞᆺ 반기ᄂᆞᆫ ᄃᆞᆺ 님이신가 아니신가.", "translation": "흐느끼는 듯 반기는 듯 임이신가 아니신가.", "note": ""}, {"original": "뎌 ᄆᆡ화(梅花) 것거 내여 님 겨신 ᄃᆡ 보내오져.", "translation": "저 매화 꺾어 내어 임 계신 데 보내고 싶구나.", "note": "*매화 : 봄에 화자가 임에게 보내고 싶은 소재"}, {"original": "님이 너ᄅᆞᆯ 보고 엇더타 너기실고.", "translation": "임이 너를 보고 어떻다 여기실까?", "note": ""}, {"original": "ᄭᅩᆺ 디고 새 닙 나니 녹음(綠陰)이 ᄭᆞᆯ렷ᄂᆞᆫᄃᆡ,", "translation": "꽃 지고 새 잎 나니 녹음이 깔렸는데,", "note": "*녹음 : 울창한 숲의 그늘(여름의 계절감)"}, {"original": "나위(羅幃) 젹막(寂寞)하고, 슈막(繡幕)이 뷔여 잇다.", "translation": "비단 휘장이 적막하고 수놓은 장막이 비어 있다.", "note": "*나위, 수막 : 휘장"}, {"original": "부용(芙蓉)을 거더 노코 공쟉(孔雀)을 둘러 두니,", "translation": "연꽃 휘장을 걷어 놓고 공작 병풍을 둘러두니,", "note": "*부용 : 휘장 \n*공작 : 공작새가 그려진 병풍"}, {"original": "ᄀᆞᆺ득 시ᄅᆞᆷ 한ᄃᆡ 날은 엇디 기돗던고.", "translation": "가뜩이나 시름 많은데 날은 어찌 길었던고.", "note": "*하다 : 많다"}, {"original": "원앙금(鴛鴦錦) 버혀 노코 오ᄉᆡᆨ션(五色線) 플텨 내여,", "translation": "원앙을 수놓은 비단을 베어 놓고 오색 실 풀어내어", "note": ""}, {"original": "금자ᄒᆡ 견화이셔 님의 옷 지어 내니,", "translation": "금 자로 재어 임의 옷 지어내니,", "note": "*견화이셔 : 치수를 재어 \n*옷 : 여름에 화자가 임에게 보내고 싶은 소재"}, {"original": "슈품(手品)은ᄏᆞ니와 졔도(制度)도 ᄀᆞᄌᆞᆯ시고,", "translation": "솜씨는 물론이거니와 격식도 갖추었구나.", "note": "*자화자찬"}, {"original": "산호슈(珊瑚樹) 지게 우ᄒᆡ ᄇᆡᆨ옥함(白玉函)의 다마 두고,", "translation": "산호수로 만든 지게 위의 백옥함에 담아두고", "note": ""}, {"original": "님의게 보내오려 님 겨신 ᄃᆡ ᄇᆞ라보니,", "translation": "임에게 보내려고 임 계신 데 바라보니,", "note": ""}, {"original": "산(山)인가 구롬인가 머흐도 머흘시고.", "translation": "산인가 구름인가 험하기도 험하구나.", "note": "*산, 구름 : 방해물, 장애물(간신)\n*머흐다 : 험하다"}, {"original": "쳔리 만리(千里 萬里) 길흘 뉘라셔 ᄎᆞ자갈고.", "translation": "천 리 만 리 길을 누가 찾아갈꼬.", "note": "*천 리 만 리 : 화자와 임 사이의 심리적 거리감"}, {"original": "니거든 여러 두고 날인가 반기실가.", "translation": "이르거든 (백옥함을) 열어 두고 나를 본 듯 반기실까.", "note": ""}, {"original": "ᄒᆞᄅᆞ밤 서리 김의 기려기 우러 녤 제,", "translation": "하룻밤 서리 기운에 기러기 울며 갈 때,", "note": "*서리, 기러기 : 가을의 계절감\n*녜다 : 가다, 살아가다"}, {"original": "위루(危樓)에 혼자 올나 수졍념(水晶簾) 거든말이,", "translation": "높은 누각에 혼자 올라 수정으로 만든 주렴을 걷으니", "note": "*주렴 : 창문이나 문에 치렁치렁 내려 둔 발"}, {"original": "동산(東山)의 ᄃᆞᆯ이 나고 북극(北極)의 별이 뵈니,", "translation": "동산에 달이 뜨고 북극에 별이 보이니", "note": "*달, 별 : 임금을 상징"}, {"original": "님인가 반기니 눈믈이 절로 난다.", "translation": "임인가  반기니 눈물이 절로 난다.", "note": ""}, {"original": "쳥광(淸光)을 픠워 내여 봉황누(鳳凰樓)의 븟티고져.", "translation": "맑은 빛을 피어 내어 봉황루에 부치고 싶구나.", "note": "*쳥광 : 가을에 임에게 보내고 싶은 소재(임금의 선정을 기원)\n*봏황루 : 봉황 누각(임금이 계신 곳)"}, {"original": "누(樓) 우ᄒᆡ 거러 두고 팔황(八荒)의 다 비최여,", "translation": "누각 위에 걸어 두고 온 세상에 다 비추어,", "note": "*팔황 : 온 세계"}, {"original": "심산궁곡(深山窮谷) 졈낫ᄀᆞ티 ᄆᆡᆼ그쇼서.", "translation": "깊은 산골과 궁벽한 골짜기를 대낮같이 만드소서.", "note": "*심산궁곡 : 어려운 백성이 있는 곳, 혹은 화자가 있는 곳"}, {"original": "건곤(乾坤)이 폐ᄉᆡᆨ(閉塞)ᄒᆞ야 ᄇᆡᆨ셜(白雪)이 ᄒᆞᆫ 빗친 제,", "translation": "온 세상이 꽉 막히고 흰 눈이 한 빛인 때,", "note": "*건곤 : 하늘과 땅(온 세상)\n*ᄇᆡᆨ셜 : 겨울의 계절감"}, {"original": "사ᄅᆞᆷ은 ᄏᆞ니와 ᄂᆞᆯ새도 긋쳐 잇다.", "translation": "사람은 물론이거니와 나는 새도 그쳐 있다.", "note": ""}, {"original": "쇼상남반(蕭湘南畔)도 치오미 이러커든", "translation": "소상강 남쪽도 추위가 이렇거늘", "note": "*소상남반 : 화자가 위치한 곳"}, {"original": "옥루고쳐(玉樓高處)야 더욱 닐러 므ᄉᆞᆷᄒᆞ리.", "translation": "임 계신 곳이야 더욱 일러 무엇하리.", "note": "*옥루고처 : 옥으로 된 누각의 높은 곳(임금이 위치한 곳)"}, {"original": "양츈(陽春)을 부쳐 내여 님 겨신 ᄃᆡ 쏘이고져.", "translation": "봄볕을 부쳐 내어 임 계신데 쏘이고 싶구나.", "note": "*양춘 : 따뜻한 봄빛(임의 추위에 대한 염려가 반영됨)"}, {"original": "모쳠(茅簷) 비쵠 ᄒᆡ를 옥루(玉樓)의 올리고져.", "translation": "초가집 처마에 비친 해를 옥루에 올리고 싶구나.", "note": "*모쳠 : 초가집 처마(화자가 위치한 곳)\n*옥루 : 옥으로 된 누각(임이 위치한 곳)"}, {"original": "홍샹(紅裳)을 니믜ᄎᆞ고 ᄎᆔ슈(翠袖)를 반(半)만 거더,", "translation": "붉은 치마를 여며 입고 푸른 소매를 반만 걷어", "note": "*니믜ᄎᆞ고 : 여미어 입고(걸치고)"}, {"original": "일모슈듁(日暮脩竹)의 헴가림도 하도 할샤.", "translation": "해 질 무렵  대나무에 기대 서서 생각이 많기도 하구나.", "note": "*혬가림 : 헤아림(=생각=걱정)"}, {"original": "댜ᄅᆞᆫ ᄒᆡ 수이 디여 긴 밤을 고초 안자,", "translation": "짧은 해 쉬이 지어 긴 밤을 꼿꼿이 앉아,", "note": ""}, {"original": "쳥등(靑燈) 거론 겻ᄐᆡ 뎐공후(鈿箜篌) 노하 두고,", "translation": "푸른 등불을 걸어 둔 곁에 자개로 장식한 공후를 놓아 두고", "note": "*뎐공후 : 악기"}, {"original": "ᄭᅮᆷ의나 님을 보려 ᄐᆞᆨ 밧고 비겨시니,", "translation": "꿈에나 임을 보려 턱 받치고 비껴 있으니,", "note": ""}, {"original": "앙금(鴦錦)도 ᄎᆞ도 챨사 이 밤은 언제 샐고.", "translation": "원앙을 수놓은 이불이 차기도 차구나, 이 밤은 언제 샐까.", "note": ""}, {"original": "ᄒᆞᄅᆞ도 열두 ᄯᅢ ᄒᆞᆫ ᄃᆞᆯ도 셜흔 날,", "translation": "하루도 열두 때 한 달도 서른 날,", "note": "*열두 때 : 과거에는 하루를 12시간으로 구분하였다"}, {"original": "져근덧 ᄉᆡᆼ각 마라 이 시ᄅᆞᆷ 닛쟈 ᄒᆞ니,", "translation": "잠깐이라도 (임) 생각을 말아서 이 시름 잊자 하니,", "note": ""}, {"original": "ᄆᆞ음의 ᄆᆡ쳐 이셔 골슈(骨髓)의 ᄭᅦ텨시니,", "translation": "마음에 맺혀 있어 뼛속까지 사무쳤으니", "note": ""}, {"original": "편쟉(扁鵲)이 열히 오다 이 병을 엇디ᄒᆞ리.", "translation": "편작이 열 명이 온다 한들 이 병을 어찌하리.", "note": "*편작 : 중국 춘추 시대의 전설적인 의사"}, {"original": "어와 내 병이야 이 님의 타시로다.", "translation": "아아, 내 병이야 이 임의 탓이로다.", "note": ""}, {"original": "ᄎᆞᆯ하리 싀어디여 범나븨 되오리라.", "translation": "차라리 죽어서 호랑나비 되리라.", "note": "*싀어디어 : 사라져, 없어져(=죽어서)"}, {"original": "곳나모 가지마다 간 ᄃᆡ 죡죡 안니다가,", "translation": "꽃나무 가지마다 간 데 족족 앉았다가,", "note": ""}, {"original": "향 므틴 날애로 님의 오ᄉᆡ 올므리라.", "translation": "향기 묻은 날개로 임의 옷에 옮으리라.", "note": "*향기 : 임에 대한 충성심, 사랑을 상징"}, {"original": "님이야 날인 줄 모ᄅᆞ셔도 내 님 조ᄎᆞ려 ᄒᆞ노라.", "translation": "임이야 나인 줄 모르셔도 내 임 좇으려 하노라.", "note": ""}];
let index=0;
const $=id=>document.getElementById(id);
function show(){
 const x=lines[index];$('count').textContent=`${index+1} / ${lines.length}`;$('bar').style.width=`${(index+1)/lines.length*100}%`;
 $('original').textContent=x.original;$('translation').textContent=x.translation;
 $('note').textContent=x.note||'';$('note').hidden=!x.note;
 $('answer').hidden=true;$('reveal').hidden=false;
 $('prev').disabled=index===0;$('next').disabled=index===lines.length-1;
}
function move(n){let k=index+n;if(k>=0&&k<lines.length){index=k;show()}}
$('reveal').onclick=()=>{$('answer').hidden=false;$('reveal').hidden=true};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '&&$('answer').hidden){e.preventDefault();$('reveal').click()}});
let startX=0,startY=0;document.querySelector('.panel').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});
document.querySelector('.panel').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1)},{passive:true});
show();
</script></body></html>
